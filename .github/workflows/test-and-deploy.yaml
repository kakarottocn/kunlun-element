name: Test and deploy

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      # - name: Install pnpm 
      #   run: npm install -g pnpm

      # - name: Install dependencies
      #   run: pnpm install --frozen-lockfile

      # - name: Run tests
      #   run: npm run test

  build:
    name: Build docs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: pnpm version
        run: pnpm --version
      
      - name: node version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: npm run docs:build
      
      - name: Check build output
        run: |
          echo "Current directory: $(pwd)"
          echo "--- packages/docs contents ---"
          ls -la ./packages/docs/
          echo "--- packages/docs/.vitepress contents ---"
          ls -la ./packages/docs/.vitepress/ || echo "No .vitepress dir"
          echo "--- Search for dist folders ---"
          find ./packages/docs -type d -name "dist" 2>/dev/null || echo "No dist found"

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./packages/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: .